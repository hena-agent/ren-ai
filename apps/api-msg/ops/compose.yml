name: ren-ai-api-msg
services:
  api-msg:
    image: ren-ai/api-msg:local
    build: .
    env_file: api-msg.env
    environment:
      LISTEN_HOST: 0.0.0.0
      PORT: "4700"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  cloudflared:
    profiles: [ingress]
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    secrets: [tunnel_token]
    restart: unless-stopped
    depends_on:
      api-msg: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
secrets:
  tunnel_token:
    file: tunnel.token
