<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Persona Lab — 인물 관찰실</title>
    <link rel="stylesheet" href="/base.css" />
    <style>
      .status {
        color: #466a4e;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      main {
        padding: 24px clamp(20px, 4vw, 56px) 40px;
        display: grid;
        gap: 18px;
        grid-template-columns: minmax(0, 1.35fr) minmax(330px, 0.85fr);
        min-height: calc(100vh - 113px);
      }
      .sheet {
        background: #faf9f4;
        border: 1px solid #c7c9bd;
        box-shadow: 5px 7px 0 #d2d4c8;
        padding: clamp(20px, 2.5vw, 36px);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 24px;
        align-items: end;
      }
      label {
        display: grid;
        gap: 7px;
        color: #556454;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      select,
      textarea {
        border: 1px solid #aeb9a8;
        background: #fffef9;
        color: #252c27;
        padding: 11px 12px;
        border-radius: 0;
      }
      textarea {
        width: 100%;
        min-height: 86px;
        resize: vertical;
      }
      select:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 2px solid #40694c;
        outline-offset: 2px;
      }
      .btn {
        border: 1px solid #43634c;
        background: #365743;
        color: white;
        padding: 11px 18px;
        font-weight: 700;
      }
      .btn.alt {
        background: transparent;
        color: #365743;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .conversation {
        min-height: 240px;
        max-height: 48vh;
        overflow-y: auto;
        padding: 20px 0;
        border-top: 1px solid #c7c9bd;
        border-bottom: 1px solid #c7c9bd;
        display: grid;
        align-content: start;
        gap: 12px;
      }
      .message {
        max-width: 85%;
        padding: 13px 16px;
        line-height: 1.7;
        white-space: pre-wrap;
        border: 1px solid #bcc6ba;
        background: #f0f3ec;
      }
      .message.user,
      .message.life {
        justify-self: end;
        background: #e4e7db;
      }
      .message.life {
        border-style: dashed;
      }
      .message.continuation {
        margin-top: -4px;
      }
      .message.continuation small {
        display: none;
      }
      .message small {
        display: block;
        color: #5f715e;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        margin-bottom: 4px;
        text-transform: uppercase;
      }
      form {
        margin-top: 22px;
        display: grid;
        gap: 12px;
      }
      .form-actions {
        display: flex;
        justify-content: space-between;
        align-items: end;
        flex-wrap: wrap;
        gap: 12px;
      }
      .side {
        overflow-y: auto;
        max-height: calc(100vh - 156px);
      }
      .profile {
        line-height: 1.75;
        color: #455547;
        margin: 0 0 25px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px 16px;
      }
      .stat {
        border-bottom: 1px solid #d7dcd1;
        padding: 4px 0 9px;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
      }
      .stat strong {
        font-variant-numeric: tabular-nums;
        font-size: 14px;
        color: #395d44;
      }
      .trait {
        border-left: 2px solid #6d8a70;
        padding: 2px 0 5px 13px;
        margin: 12px 0;
      }
      .trait small,
      .muted {
        color: #697a69;
        font-size: 12px;
        line-height: 1.6;
      }
      .trait p {
        margin: 4px 0;
        font-size: 13px;
      }
      .error {
        color: #9c3f32;
        font-size: 13px;
        min-height: 20px;
      }
      @media (max-width: 800px) {
        main {
          grid-template-columns: 1fr;
        }
        .side {
          max-height: none;
        }
        header {
          align-items: start;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Observation room / 001</p>
        <h1>Persona Lab</h1>
      </div>
      <span class="status">LOCAL EXPERIMENT</span>
    </header>
    <main>
      <section class="sheet" aria-labelledby="conversation-title">
        <div class="controls">
          <label
            >관찰할 인물<select id="persona">
              <option value="harin">하린 · 사진가</option>
              <option value="jiwoo">지우 · 새 직장</option>
            </select></label
          >
          <label>세션<select id="session"></select></label>
          <button class="btn alt" id="new" type="button">새 세션</button>
          <button class="btn alt" id="reset" type="button">인물 초기화</button>
          <button class="btn alt" id="export" type="button">기록 내려받기</button>
          <label
            >기록 불러오기<input id="import" type="file" accept="application/json,.json"
          /></label>
        </div>
        <h2 id="conversation-title">대화와 사건</h2>
        <div class="conversation" id="conversation" role="log" aria-live="polite"></div>
        <form id="composer">
          <label for="text">메시지 또는 실제 일어난 사건</label>
          <textarea
            id="text"
            required
            placeholder="하린에게 말을 걸거나, 확정된 생활 사건을 기록하세요."
          ></textarea>
          <div class="form-actions">
            <label
              >입력 종류<select id="kind">
                <option value="user">사용자 메시지</option>
                <option value="life">생활 사건</option>
              </select></label
            ><button class="btn" id="send">보내기</button>
          </div>
        </form>
        <p class="muted">
          여러 번 나눠 보내도 됩니다. 보낸 메시지는 바로 나타나고 답장은 잠시 뒤 도착합니다. 화면은
          주기적으로 갱신되며, `시간 진행`을 누르면 다음 판단이 즉시 실행됩니다.
        </p>
        <p class="error" id="error" role="alert"></p>
      </section>
      <aside class="sheet side" aria-labelledby="state-title">
        <p class="eyebrow">Private notes / 내부 관찰</p>
        <h2 id="state-title">인물의 현재</h2>
        <p class="profile" id="profile"></p>
        <p class="eyebrow" id="stage"></p>
        <h3>기본 특성</h3>
        <div class="stats" id="base"></div>
        <h3>가변 성격</h3>
        <div class="stats" id="mutable"></div>
        <h3>현재 상태</h3>
        <div class="stats" id="condition"></div>
        <h3>이 사용자와의 관계</h3>
        <div class="stats" id="relationship"></div>
        <h3>숨겨진 면과 새로 생긴 특성</h3>
        <div id="traits"></div>
        <h3>사건 기록</h3>
        <p class="muted" id="history">아직 기록된 사건이 없습니다.</p>
        <h3>시간과 판단</h3>
        <p class="muted" id="clock"></p>
        <label
          >가상 시간 진행<select id="minutes">
            <option value="5">5분</option>
            <option value="30">30분</option>
            <option value="60">1시간</option>
            <option value="1440">1일</option>
          </select></label
        >
        <button class="btn alt" id="tick" type="button">시간 진행 →</button>
        <p class="muted" id="decisions"></p>
        <h3>이번 턴의 변경 근거</h3>
        <p class="muted" id="changes">아직 변경이 없습니다.</p>
      </aside>
    </main>
    <script type="module">
      const $ = (id) => document.getElementById(id);
      const labels = {
        autonomy: "자율성",
        sociability: "사교성",
        initiative: "연락 주도성",
        sensitivity: "감수성",
        expression: "감정 표현성",
        novelty: "새로움 선호",
        mood: "기분",
        energy: "활력",
        stress: "스트레스",
        connection: "교류 욕구",
        solitude: "혼자 있을 욕구",
        familiarity: "친숙함",
        trust: "신뢰",
        affection: "호감",
        disappointment: "서운함",
        stage: "관계 단계",
        openness: "자기 개방",
        guardedness: "방어적 태도",
      };
      const stageLabels = {
        stranger: "초면",
        acquaintance: "알아가기",
        familiar: "친숙함",
        flirting: "썸",
        dating: "연애",
        ended: "종료",
      };
      const timeFormatter = new Intl.DateTimeFormat("ko-KR", {
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23",
      });
      let current;
      const renderScores = (id, scores) => {
        $(id).replaceChildren(
          ...Object.entries(scores).map(([key, value]) => {
            const row = document.createElement("div");
            row.className = "stat";
            const label = document.createElement("span");
            label.textContent =
              id === "mutable" && key === "initiative" ? "지금의 주도 의향" : (labels[key] ?? key);
            const number = document.createElement("strong");
            number.textContent = value;
            row.append(label, number);
            return row;
          }),
        );
      };
      const render = () => {
        const session = current.session;
        const times = new Map();
        for (const entry of current.entries)
          if (entry.type === "input") times.set(entry.event.id, entry.at);
        for (const decision of current.decisions)
          if (decision.replyId) times.set(decision.replyId, decision.at);
        $("profile").textContent = session.definition.profile;
        $("stage").textContent = `관계 단계 · ${stageLabels[session.stage] ?? session.stage}`;
        renderScores("base", session.definition.base);
        renderScores("mutable", session.mutable);
        renderScores("condition", session.condition);
        renderScores("relationship", session.relationship);
        $("conversation").replaceChildren(
          ...session.events.flatMap((event) => {
            const speaker =
              event.kind === "reply"
                ? session.definition.name
                : event.kind === "life"
                  ? "생활 사건"
                  : "사용자";
            const lines =
              event.kind === "reply" ? event.text.split("\n").filter(Boolean) : [event.text];
            return lines.map((text, index) => {
              const box = document.createElement("div");
              box.className = `message ${event.kind}`;
              box.dataset.speaker = speaker;
              const at = times.get(event.id);
              box.dataset.time =
                at === undefined ? "시간 미상" : timeFormatter.format(new Date(at));
              if (index > 0) box.classList.add("continuation");
              const label = document.createElement("small");
              label.textContent = index === 0 ? speaker : "";
              const body = document.createElement("span");
              body.textContent = text;
              box.append(label, body);
              return box;
            });
          }),
        );
        $("traits").replaceChildren(
          ...session.traits.map((trait) => {
            const box = document.createElement("div");
            box.className = "trait";
            const name = document.createElement("strong");
            name.textContent = `${trait.name} · ${trait.strength}`;
            const detail = document.createElement("p");
            detail.textContent = `${trait.origin === "hidden" ? "원래 있던 면" : "새로 형성됨"} · ${trait.persistence === "lasting" ? "지속" : "상황 한정"} · ${trait.active ? "활성" : "종료"}${trait.revealed ? " · 드러남" : " · 숨겨짐"}`;
            const evidence = document.createElement("small");
            evidence.textContent = `상황: ${trait.context} / 근거: ${trait.evidence.join(", ") || "생성 시 설정"}`;
            box.append(name, detail, evidence);
            return box;
          }),
        );
        $("history").textContent = session.events.length
          ? session.events.map((event) => `${event.id} · ${event.kind}: ${event.text}`).join("\n")
          : "아직 기록된 사건이 없습니다.";
        $("history").style.whiteSpace = "pre-wrap";
        $("clock").textContent =
          `가상 시각: ${new Date(Date.now() + current.offset).toLocaleString()} · 다음 판단: ${new Date(current.nextCheckAt).toLocaleString()}`;
        $("decisions").textContent =
          current.decisions
            .map(
              (decision) =>
                `${new Date(decision.at).toLocaleString()} · ${decision.trigger} · Jev: ${decision.requested} → ${decision.action} · 확률 ${JSON.stringify(decision.probabilities)} · 적용 ${decision.applied.map((change) => `${change.kind}.${change.field ?? "trait"}=${change.value ?? "변경"}`).join(", ") || "없음"} · 대기 ${decision.pendingIds.length}${decision.error ? ` (${decision.error})` : ""}`,
            )
            .join("\n") || "아직 판단 기록이 없습니다.";
        $("decisions").style.whiteSpace = "pre-wrap";
      };
      document.addEventListener("copy", (event) => {
        const selection = window.getSelection();
        const conversation = $("conversation");
        if (
          !event.clipboardData ||
          !selection?.rangeCount ||
          selection.isCollapsed ||
          !conversation.contains(selection.anchorNode)
        )
          return;
        const range = selection.getRangeAt(0);
        const messages = [...conversation.querySelectorAll(".message")].filter((box) =>
          range.intersectsNode(box),
        );
        if (!messages.length) return;
        event.clipboardData.setData(
          "text/plain",
          messages
            .map(
              (box) =>
                `${box.dataset.speaker}:\n[${box.dataset.time}] ${box.querySelector("span").textContent}`,
            )
            .join("\n\n"),
        );
        event.preventDefault();
      });
      const refreshList = async (selectId) => {
        const sessions = await (await fetch(`/sessions?persona=${$("persona").value}`)).json();
        $("session").replaceChildren(
          ...sessions.map((info) => {
            const option = document.createElement("option");
            option.value = info.id;
            option.textContent = `${info.id.slice(0, 8)} · ${info.events}건`;
            return option;
          }),
        );
        if (selectId) $("session").value = selectId;
        return sessions;
      };
      const openSession = async (id) => {
        const response = await fetch(`/session?session=${id}`);
        if (!response.ok) throw new Error("세션을 불러오지 못했습니다.");
        const refreshed = await response.json();
        if (current && refreshed.session.id === current.session.id) {
          if (
            refreshed.decisions.length < current.decisions.length ||
            refreshed.entries.length < current.entries.length
          )
            return;
          if (
            refreshed.entries.length === current.entries.length &&
            refreshed.decisions.length === current.decisions.length &&
            refreshed.nextCheckAt === current.nextCheckAt &&
            refreshed.offset === current.offset
          )
            return;
        }
        current = refreshed;
        render();
      };
      const start = async () => {
        $("error").textContent = "";
        $("changes").textContent = "아직 변경이 없습니다.";
        const sessions = await refreshList();
        let id = sessions[0]?.id;
        if (!id) {
          const created = await (
            await fetch(`/new?persona=${$("persona").value}`, { method: "POST" })
          ).json();
          id = created.session.id;
          await refreshList(id);
        }
        $("session").value = id;
        await openSession(id);
      };
      const newSession = async () => {
        $("error").textContent = "";
        const response = await fetch(`/new?persona=${$("persona").value}`, { method: "POST" });
        const created = await response.json();
        if (!response.ok) throw new Error(created.error);
        $("changes").textContent = "새 세션을 시작했습니다.";
        await refreshList(created.session.id);
        current = created;
        render();
      };
      $("new").addEventListener("click", () => {
        newSession().catch((error) => {
          $("error").textContent = error.message;
        });
      });
      $("session").addEventListener("change", () => {
        openSession($("session").value).catch((error) => {
          $("error").textContent = error.message;
        });
      });
      $("reset").addEventListener("click", () => {
        if (!current || !confirm("이 세션의 대화와 판단 기록을 모두 초기화할까요?")) return;
        fetch(`/reset?session=${current.session.id}`, { method: "POST" })
          .then(async (response) => {
            const result = await response.json();
            if (!response.ok) throw new Error(result.error);
            current = result;
            $("changes").textContent = "초기화되었습니다.";
            render();
          })
          .catch((error) => {
            $("error").textContent = error.message;
          });
      });
      $("persona").addEventListener("change", () => {
        start().catch((error) => {
          $("error").textContent = error.message;
        });
      });
      $("export").addEventListener("click", async () => {
        if (!current) return;
        try {
          const response = await fetch(`/export?session=${current.session.id}`);
          if (!response.ok) throw new Error("기록을 내려받지 못했습니다.");
          const file = new Blob([JSON.stringify(await response.json(), null, 2)], {
            type: "application/json",
          });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(file);
          link.download = `persona-${current.session.id.slice(0, 8)}.json`;
          link.click();
          URL.revokeObjectURL(link.href);
        } catch (error) {
          $("error").textContent = error.message;
        }
      });
      $("import").addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file || !current || !confirm("저장한 기록을 새 세션으로 불러올까요?")) return;
        try {
          const response = await fetch(`/import?session=${current.session.id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: await file.text(),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error);
          $("changes").textContent = "저장된 응답으로 재현했습니다.";
          await refreshList(result.session.id);
          current = result;
          $("error").textContent = "";
          render();
        } catch (error) {
          $("error").textContent = error.message;
        }
        event.target.value = "";
      });
      $("composer").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!current) return;
        $("send").disabled = true;
        $("error").textContent = "";
        try {
          const response = await fetch(`/input?session=${current.session.id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: crypto.randomUUID(),
              kind: $("kind").value,
              text: $("text").value.trim(),
            }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error);
          current = result;
          $("text").value = "";
          render();
          $("changes").textContent = "메시지를 보냈습니다. 잠시 뒤 답장이 도착합니다.";
        } catch (error) {
          $("error").textContent = error.message;
        } finally {
          $("send").disabled = false;
        }
      });
      $("tick").addEventListener("click", async () => {
        if (!current) return;
        $("tick").disabled = true;
        try {
          const response = await fetch(
            `/tick?session=${current.session.id}&minutes=${$("minutes").value}`,
            { method: "POST" },
          );
          const result = await response.json();
          if (!response.ok) throw new Error(result.error);
          current = result;
          $("error").textContent = "";
          render();
        } catch (error) {
          $("error").textContent = error.message;
        } finally {
          $("tick").disabled = false;
        }
      });
      setInterval(() => {
        if (current)
          openSession(current.session.id).catch((error) => {
            $("error").textContent = error.message;
          });
      }, 2_000);
      start().catch((error) => {
        $("error").textContent = error.message;
      });
    </script>
  </body>
</html>
