[package]
name = "ren-rustpush"
version = "0.1.0"
edition = "2021"
publish = false

[profile.dev]
debug = "line-tables-only"
incremental = false

[dependencies]
rustpush = { path = "../../node_modules/.cache/ren-rustpush/rustpush" }
keystore = { path = "../../node_modules/.cache/ren-rustpush/rustpush/keystore" }
nac-validation = { path = "../../node_modules/.cache/ren-rustpush/matrix/nac-validation" }
icloud_auth = { path = "../../node_modules/.cache/ren-rustpush/rustpush/third_party/apple-private-apis/icloud-auth" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.7"
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
libc = "0.2"
rpassword = "7"
sha2 = "0.10"

[patch.crates-io]
quinn = { path = "../../node_modules/.cache/ren-rustpush/rustpush/third_party/quinn/quinn" }

[build-dependencies]
cc = "1"

[dev-dependencies]
reqwest = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["test-util"] }
