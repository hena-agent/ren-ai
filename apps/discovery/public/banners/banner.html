<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Ren AI — 네 생각나서, 문자했어.</title>
    <link rel="stylesheet" href="banner.css" />
  </head>
  <body>
    <a
      class="banner"
      href="https://renai.im/?utm_source=banner&utm_medium=display&utm_campaign=thinking_of_you"
      target="_blank"
      rel="noopener"
      aria-label="Ren AI — 네 생각나서, 문자했어. iMessage로 이어지는 AI와의 일상. 만나보기 (새 창)"
    >
      <div class="copy">
        <div class="brand"><img src="../brand.svg" alt="" />Ren AI</div>
        <h1>네 생각나서, <em>문자했어.</em></h1>
        <p>iMessage로 이어지는 AI와의 일상</p>
      </div>
      <div class="portrait">
        <img src="../landing/dohee-anime.webp" alt="백지아의 애니메 스타일 이미지" />
        <span class="name">백지아</span>
      </div>
      <div class="conversation" aria-hidden="true">
        <div class="contact">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 3C6.5 3 2 6.6 2 11c0 2.5 1.4 4.8 3.6 6.3L4.8 21l4.6-2.2c.8.1 1.7.2 2.6.2 5.5 0 10-3.6 10-8S17.5 3 12 3Z"
            />
          </svg>
          <span>iMessage</span><small>대화 예시</small>
        </div>
        <div class="messages">
          <div class="typing"><i></i><i></i><i></i></div>
          <span class="bubble first">오늘 어땠어?</span>
          <span class="bubble second">난 아까 네 생각났는데.</span>
        </div>
      </div>
      <div class="action">
        <span class="installation">별도 앱 설치 없이</span>
        <span class="cta"
          >만나보기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 12h15m-6-6 6 6-6 6" /></svg
        ></span>
        <span class="platform">iPhone · iMessage</span>
      </div>
    </a>
  </body>
</html>
