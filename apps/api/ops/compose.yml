name: ren-ai
services:
  install-location:
    profiles: [tools]
    image: ren-ai/plugin:local
    build:
      context: ../../..
      dockerfile: apps/api/ops/Dockerfile
      target: plugin
    network_mode: none
    volumes:
      - persona-location:/location
      - ${REN_AI_LOCATION_INPUT:?Set REN_AI_LOCATION_INPUT to reviewed config directory}:/input:ro
volumes:
  application-state:
    name: ${REN_AI_STATE_VOLUME:-ren-ai-application-state}
  persona-location:
    external: true
    name: ${REN_AI_LOCATION_VOLUME:-ren-ai-opencode-location}
