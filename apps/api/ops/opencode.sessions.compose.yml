# Apply AFTER the user-owned OpenCode Compose file, never as a standalone stack.
# Only OpenCode gets this mount; the application uses authenticated plugin RPC.
services:
  opencode-upstream:
    environment:
      TOKEN_MANAGEMENT: ${TOKEN_MANAGEMENT:?Set the existing management token in the protected environment}
    volumes:
      - persona-location:/srv/ren-ai:ro
      - persona-life:/srv/ren-ai/personas
      - persona-sandboxes:/srv/ren-ai/sandboxes
volumes:
  persona-location:
    external: true
    name: ${REN_AI_LOCATION_VOLUME:-ren-ai-opencode-location}
  persona-life:
    name: ${REN_AI_PERSONA_VOLUME:-ren-ai-opencode-personas}
  persona-sandboxes:
    name: ${REN_AI_SANDBOX_VOLUME:-ren-ai-opencode-sandboxes}
