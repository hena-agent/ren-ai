name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Proves the quality gates still pass when nobody has touched the repo.
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  checks:
    name: Checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      # OpenCode uses explicit resource management (await using), which needs
      # Node 24. Bun installs and runs scripts; Node runs tests with v8 coverage.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # A clean checkout is always a clean tree. bun's isolated installs are not
      # pruned incrementally, so a stale local node_modules can hide a removed
      # dependency that fails here.
      - run: bun install --frozen-lockfile
      - run: bun run ci:checks

  verify:
    name: Gate self-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # Plants bad files; use a separate checkout from tests/build.
      - run: bun run verify-gates

  gates:
    name: Quality gates
    needs: [checks, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every gate to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          test "$CHECKS" = success
          test "$VERIFY" = success

  # The Messages Mac pulls this attested bundle itself (packages/imsg.hena.dev/ops/update.sh);
  # nothing here can reach the Mac.
  mac-bundle:
    name: Build imsg.hena.dev bundle
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The bundle runs on the Bun installed on the Mac, not the toolchain the gates use.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bash packages/imsg.hena.dev/ops/build-bundle.sh "$RUNNER_TEMP/imsg-bundle"
      - run: tar -czf imsg-bundle.tar.gz -C "$RUNNER_TEMP/imsg-bundle" .
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: imsg-bundle.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: imsg-bundle
          path: imsg-bundle.tar.gz
          retention-days: 30
          if-no-files-found: error

  deploy:
    name: Deploy discovery.hena.dev
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/discovery.hena.dev build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - run: bun run --cwd packages/discovery.hena.dev deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The Ambivalent Co. Workers pin their account in wrangler.jsonc; the token belongs to it.
  deploy-admin:
    name: Deploy admin.ambivalent.dev
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-admin-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # Migrations land before the code that needs them.
      - run: bun run --cwd apps/admin db:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_AMBIVALENT }}
      - run: bun run --cwd apps/admin deploy --message "ci.yml $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_AMBIVALENT }}
      - run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://admin.ambivalent.dev/api/personas

  deploy-discovery-ambivalent:
    name: Deploy discovery.ambivalent.dev
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-discovery-ambivalent-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/discovery build
        env:
          VITE_DISCOVERY_API_URL: https://api-msg.hena.dev
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - run: bun run --cwd apps/discovery deploy --message "ci.yml $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_AMBIVALENT }}
      - run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://discovery.ambivalent.dev/
