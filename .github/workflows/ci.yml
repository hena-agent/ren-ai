name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Proves the template is still green when nobody has touched it.
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    concurrency:
      group: gates-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      # Vitest requires Node >= 22.12 and does not support the bun runtime with
      # the v8 coverage provider. bun installs and runs scripts; Node runs tests.
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      # A clean checkout is always a clean tree. bun's isolated installs are not
      # pruned incrementally, so a stale local node_modules can hide a removed
      # dependency that fails here.
      - run: bun install --frozen-lockfile
      # Includes mutation testing, which runs in ~2s today. If it stops being cheap,
      # split it into its own job: incremental on PRs, full on main and nightly.
      - run: bun run ci

  deploy:
    name: Deploy msg.hena.dev
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/msg.hena.dev build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - run: bun run --cwd packages/msg.hena.dev deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
