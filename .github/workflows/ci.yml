name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Proves the quality gates still pass when nobody has touched the repo.
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  checks:
    name: Checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      # OpenCode uses explicit resource management (await using), which needs
      # Node 24. Bun installs and runs scripts; Node runs tests with v8 coverage.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # A clean checkout is always a clean tree. bun's isolated installs are not
      # pruned incrementally, so a stale local node_modules can hide a removed
      # dependency that fails here.
      - run: bun install --frozen-lockfile
      - run: bun run ci:checks

  verify:
    name: Gate self-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # Plants bad files; use a separate checkout from tests/build.
      - run: bun run verify-gates

  gates:
    name: Quality gates
    needs: [checks, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every gate to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          test "$CHECKS" = success
          test "$VERIFY" = success

  deploy:
    name: Deploy discovery.hena.dev
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/discovery.hena.dev build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - run: bun run --cwd packages/discovery.hena.dev deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
