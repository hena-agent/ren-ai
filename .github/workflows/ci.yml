name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Proves the quality gates still pass when nobody has touched the repo.
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  checks:
    name: Checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      # OpenCode uses explicit resource management (await using), which needs
      # Node 24. Bun installs and runs scripts; Node runs tests with v8 coverage.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # A clean checkout is always a clean tree. bun's isolated installs are not
      # pruned incrementally, so a stale local node_modules can hide a removed
      # dependency that fails here.
      - run: bun install --frozen-lockfile
      - run: bun run ci:checks

  verify:
    name: Gate self-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # Plants bad files; use a separate checkout from tests/build.
      - run: bun run verify-gates

  native:
    name: Rustpush checks and build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: brew install protobuf
      - run: bash apps/rustpush/prepare.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/build/ren-ai-rustpush
            apps/rustpush/target
          key: rustpush-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/rustpush/Cargo.toml', 'apps/rustpush/Cargo.lock', 'apps/rustpush/.cargo/config.toml', 'apps/rustpush/native.patch', 'apps/rustpush/rust-toolchain.toml') }}
      - run: cargo install cargo-llvm-cov --version 0.8.5 --locked
      - run: cargo install rust-code-analysis-cli --version 0.0.25 --locked
      - run: bash apps/rustpush/check.sh
      - run: cargo build --release --locked
        working-directory: apps/rustpush
      - uses: actions/upload-artifact@v7
        with:
          name: rustpush-native
          path: apps/rustpush/target/release/ren-rustpush
          if-no-files-found: error

  gates:
    name: Quality gates
    needs: [checks, verify, native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every gate to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          VERIFY: ${{ needs.verify.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          test "$CHECKS" = success
          test "$VERIFY" = success
          test "$NATIVE" = success

  # The Messages Mac pulls this attested bundle itself (apps/imsg/ops/update.sh);
  # nothing here can reach the Mac.
  mac-bundle:
    name: Build imsg bundle
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Ship the same pinned Bun runtime that builds and tests the bundle.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: rustpush-native
          path: native
      - run: chmod 700 native/ren-rustpush
      - run: bash apps/imsg/ops/build-mac.sh "$RUNNER_TEMP/imsg-bundle" "$PWD/native/ren-rustpush"
      - run: tar -czf imsg-bundle.tar.gz -C "$RUNNER_TEMP/imsg-bundle" .
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: imsg-bundle.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: imsg-bundle
          path: imsg-bundle.tar.gz
          retention-days: 30
          if-no-files-found: error

  social-bundle:
    name: Build social executor bundle
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/social build
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: apps/social/dist/entry.js
      - uses: actions/upload-artifact@v7
        with:
          name: social-bundle
          path: apps/social/dist/entry.js
          if-no-files-found: error

  api-msg-bundle:
    name: Build api-msg bundle
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bash apps/api-msg/ops/build-bundle.sh "$RUNNER_TEMP/api-msg-bundle"
      - run: bash apps/api-msg/ops/check-container.sh "$RUNNER_TEMP/api-msg-bundle"
      - run: tar -czf api-msg-bundle.tar.gz -C "$RUNNER_TEMP/api-msg-bundle" .
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: api-msg-bundle.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: api-msg-bundle
          path: api-msg-bundle.tar.gz
          retention-days: 30
          if-no-files-found: error

  # The Workers pin the Ambivalent Co. account in wrangler.jsonc; the token belongs to it.
  deploy-admin:
    name: Deploy admin.renai.im
    needs: [gates, deploy-api-app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-admin-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # Migrations land before the code that needs them.
      - run: bun run --cwd apps/admin db:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Stored Persona projections are derived by the code about to read them.
      - run: bun run --cwd apps/admin projections --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: bun run --cwd apps/admin deploy --message "ci.yml $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Saves served by the previous version during the rollout get projections too.
      - run: bun run --cwd apps/admin projections --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://admin.renai.im/api/personas
      - run: bun run --cwd apps/api check:health https://admin.renai.im admin "$GITHUB_SHA"

  deploy-discovery:
    name: Deploy renai.im
    needs: [gates, deploy-api-app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-discovery-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/discovery build
        env:
          VITE_DISCOVERY_API_URL: https://api.renai.im
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - run: bun run --cwd apps/discovery check:worker
      - run: bun run --cwd apps/discovery deploy --message "ci.yml $GITHUB_SHA" --define "BUILD_REVISION:\"$GITHUB_SHA\""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://renai.im/
      - run: bun run --cwd apps/api check:health https://renai.im discovery "$GITHUB_SHA"
      - run: bun run --cwd apps/discovery check:preview https://renai.im "$GITHUB_SHA"
      - run: |
          for locale in ko en ja; do
            prefix="/$locale"
            if [ "$locale" = en ]; then prefix=""; fi
            for path in "${prefix:-/}" "$prefix/explore" "/social-$locale-v3.png"; do
              curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "https://renai.im$path"
            done
          done
      - run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://renai.im/sitemap.xml

  deploy-api-app:
    name: Deploy api.renai.im
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: deploy-api-app-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # A coordinated contract/plugin rollout keeps execution paused across CI deployments.
      - run: bun run --cwd apps/api deploy --var "BOOTSTRAP_ONLY:$BOOTSTRAP_ONLY" --message "ci.yml $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOOTSTRAP_ONLY: ${{ vars.API_BOOTSTRAP_ONLY || 'false' }}
      - run: bun run --cwd apps/api check:health https://api.renai.im api-app "$GITHUB_SHA"
      - run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null 'https://api.renai.im/discovery/personas?locale=ko'
